<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de compras</title>
<style>
:root{--bg:#f4f6f1;--surf:#fff;--ink:#1d2a22;--mute:#667369;--acc:#2f7d4f;--on:#fff;--line:#dde3da;--chk:#9aa59d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--surf:#1d2620;--ink:#e8efe9;--mute:#9aa89e;--acc:#5fbf86;--on:#0f1a13;--line:#2b372f;--chk:#6c786f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a16;--surf:#1d2620;--ink:#e8efe9;--mute:#9aa89e;--acc:#5fbf86;--on:#0f1a13;--line:#2b372f;--chk:#6c786f;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:14px 12px 16px;position:relative;color:#fff;background:linear-gradient(135deg,#2f8f5b,#1b5e3b);border-radius:0 0 28px 28px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#cnt{flex-basis:100%;margin:0 6px;font-size:14px;opacity:.92}
#prog{flex-basis:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:4px}
#prog i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .4s}
#sel{flex:1;min-width:0;appearance:none;border:0;background:none;font-size:24px;font-weight:700;padding:8px 4px;text-overflow:ellipsis;color:#fff}
#sel option{color:#1d2a22}
.ib{width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;color:var(--acc)}
.ib:active{background:var(--line)}
header .ib{color:#fff;background:rgba(255,255,255,.16)}
#menu{color:var(--ink);position:absolute;right:12px;top:62px;z-index:5;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:8px}
#menu button:active{background:var(--line)}
main{flex:1;overflow-y:auto;padding:0 12px 12px}
.grp{margin:18px 0 0}
.gh{display:flex;align-items:center;gap:8px;margin:0 4px 8px;font-weight:700;font-size:15px}
.gh i{width:6px;height:18px;border-radius:3px;background:var(--c)}
.gh b{font-size:12px;font-weight:600;color:var(--mute);margin-left:auto}
.gl{list-style:none;margin:0;padding:0;background:var(--surf);border-radius:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
li{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 14px;border-bottom:1px solid var(--line);min-height:60px}
li:last-child{border-bottom:0}
li input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--chk);flex:none;display:grid;place-items:center;margin:0}
li input:checked{background:var(--c);border-color:var(--c)}
li input:checked::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent)}
li span{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0;font-size:17px}
li.done{opacity:.55}
li.done span{text-decoration:line-through}
li button{width:44px;height:44px;color:var(--mute);font-size:18px;border-radius:50%}
#empty{text-align:center;color:var(--mute);margin:56px 24px}
#empty span{display:block;font-size:64px;margin-bottom:8px}
footer{padding:8px 12px 12px;background:var(--bg)}
#f{display:flex;gap:8px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:28px;padding:5px 5px 5px 16px}
#inp{flex:1;min-width:0;border:0;outline:0;background:none;padding:10px 0;font-size:17px}
#mic{width:44px;height:44px;font-size:20px;border-radius:50%}
#mic[hidden]{display:none}
#add{background:var(--acc);color:var(--on);font-weight:600;border-radius:22px;padding:0 18px;height:44px}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
dialog{border:0;border-radius:16px;background:var(--surf);color:var(--ink);padding:20px;width:min(340px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#dt{margin:0 0 12px;font-weight:600}
#di{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#di[hidden]{display:none}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.row button{padding:10px 16px;border-radius:10px;color:var(--acc);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
#chips:empty{display:none}
#chips button{flex:none;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:14px}
</style>
</head>
<body>
<header>
  <select id="sel" aria-label="Lista activa"></select>
  <button class="ib" id="bNew" aria-label="Nueva lista">+</button>
  <button class="ib" id="bMenu" aria-label="Más opciones">⋮</button>
  <div id="menu" hidden>
    <button data-a="share">Compartir lista</button>
    <button data-a="uncheck">Desmarcar todo</button>
    <button data-a="clear">Quitar marcados</button>
    <button data-a="rename">Renombrar lista</button>
    <button data-a="del">Eliminar lista</button>
  </div>
  <p id="cnt"></p>
  <div id="prog"><i></i></div>
</header>
<main>
  <div id="ul"></div>
  <p id="empty"><span>🛒</span>Tu lista está vacía.<br>Escribe un artículo abajo o toca el micrófono.</p>
</main>
<footer>
  <div id="chips"></div>
  <form id="f" autocomplete="off">
    <input id="inp" list="dl" placeholder="Añadir artículo…" enterkeyhint="done" aria-label="Nuevo artículo">
    <datalist id="dl"></datalist>
    <button type="button" class="ib" id="mic" aria-label="Dictar por voz">🎤</button>
    <button type="submit" id="add">Añadir</button>
  </form>
</footer>
<dialog id="dlg">
  <form method="dialog">
    <p id="dt"></p>
    <input id="di" maxlength="40">
    <div class="row">
      <button type="button" id="dno">Cancelar</button>
      <button value="ok">Aceptar</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const [sel,ul,cnt,empty,dl,inp,mic,f,menu,dlg,dt,di,toast,chips,prog]=['#sel','#ul','#cnt','#empty','#dl','#inp','#mic','#f','#menu','#dlg','#dt','#di','#toast','#chips','#prog'].map($);
const K='lista-compras-v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.lists)||!S.lists.length){const id=uid();S={lists:[{id,name:'Mi lista',items:[]}],cur:id,hist:[]}}
if(!Array.isArray(S.hist))S.hist=[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cur=()=>S.lists.find(l=>l.id===S.cur)||S.lists[0];
const el=(t,p)=>Object.assign(document.createElement(t),p||{});
const say=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),2000)};

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const CATS=[
 {n:'Frutas y verduras',e:'🥬',c:'#43a047',k:'manzana platano naranja limon mandarina tomate lechuga cebolla patata zanahoria fruta verdura pepino pimiento ajo fresa uva pera aguacate melon sandia espinaca calabacin brocoli champinon seta'},
 {n:'Carne y pescado',e:'🥩',c:'#e53935',k:'pollo carne ternera cerdo jamon salchicha pescado atun salmon merluza gamba chorizo bacon hamburguesa pavo lomo'},
 {n:'Lácteos y huevos',e:'🥛',c:'#1e88e5',k:'leche queso yogur mantequilla huevo nata flan'},
 {n:'Panadería y dulces',e:'🍞',c:'#fb8c00',k:'pan bollo galleta harina cereal tostada croissant magdalena chocolate helado'},
 {n:'Despensa',e:'🥫',c:'#8d6e63',k:'arroz pasta aceite sal azucar lenteja garbanzo conserva salsa cafe te fideo mayonesa vinagre'},
 {n:'Bebidas',e:'🥤',c:'#00acc1',k:'agua zumo cerveza vino refresco cola'},
 {n:'Hogar e higiene',e:'🧴',c:'#8e24aa',k:'detergente jabon papel champu lejia gel dentifrico fregona suavizante bolsa servilleta cepillo'},
 {n:'Otros',e:'🛒',c:'#607d8b',k:''}
].map(c=>({...c,r:c.k?new RegExp('(^|\\s)('+c.k.split(' ').join('|')+')[a-z]{0,2}($|\\s)'):null}));
const cat=t=>{const s=norm(t);return CATS.find(c=>c.r&&c.r.test(s))||CATS[CATS.length-1]};
const EM={manzana:'🍎',platano:'🍌',naranja:'🍊',limon:'🍋',tomate:'🍅',zanahoria:'🥕',patata:'🥔',cebolla:'🧅',ajo:'🧄',lechuga:'🥬',pollo:'🍗',carne:'🥩',pescado:'🐟',huevo:'🥚',leche:'🥛',queso:'🧀',pan:'🍞',arroz:'🍚',pasta:'🍝',agua:'💧',cerveza:'🍺',vino:'🍷',cafe:'☕',aceite:'🫒',galleta:'🍪',yogur:'🥣',aguacate:'🥑',fresa:'🍓',uva:'🍇',sandia:'🍉',chocolate:'🍫',helado:'🍦',papel:'🧻',jabon:'🧼',pizza:'🍕'};
const emo=(t,c)=>{for(const x of norm(t).split(/\s+/)){const k=Object.keys(EM).find(k=>x===k||x===k+'s'||x===k+'es');if(k)return EM[k]}return c.e};
function render(){
  const l=cur();S.cur=l.id;
  sel.replaceChildren(...S.lists.map(x=>el('option',{value:x.id,textContent:x.name,selected:x.id===l.id})));
  const row=(i,c)=>{
    const li=el('li',{className:i.d?'done':''});li.style.setProperty('--c',c.c);
    const cb=el('input',{type:'checkbox',checked:i.d});
    cb.setAttribute('aria-label','Marcar '+i.t);
    cb.onchange=()=>{i.d=cb.checked;render()};
    const av=el('div',{className:'av',textContent:emo(i.t,c)});
    const t=el('span',{textContent:i.t});
    t.onclick=()=>{i.d=!i.d;render()};
    const x=el('button',{textContent:'✕'});
    x.setAttribute('aria-label','Eliminar '+i.t);
    x.onclick=()=>{l.items=l.items.filter(y=>y!==i);render()};
    li.append(cb,av,t,x);return li;
  };
  const grp=(name,ic,color,arr)=>{
    const g=el('section',{className:'grp'});g.style.setProperty('--c',color);
    const h=el('div',{className:'gh'});
    h.append(el('i'),el('span',{textContent:ic+' '+name}),el('b',{textContent:String(arr.length)}));
    const u=el('ul',{className:'gl'});u.append(...arr.map(([i,c])=>row(i,c)));
    g.append(h,u);return g;
  };
  const todo=l.items.filter(i=>!i.d),done=l.items.filter(i=>i.d);
  const gs=[];
  CATS.forEach(c=>{const a=todo.filter(i=>cat(i.t)===c).map(i=>[i,c]);if(a.length)gs.push(grp(c.n,c.e,c.c,a))});
  if(done.length)gs.push(grp('En el carro','✅','#9aa59d',done.map(i=>[i,cat(i.t)])));
  ul.replaceChildren(...gs);
  const n=todo.length,tot=l.items.length;
  cnt.textContent=tot?(n?n+' por comprar de '+tot:'¡Todo en el carro! 🎉'):'Lista vacía';
  prog.firstElementChild.style.width=tot?(100*(tot-n)/tot)+'%':'0%';
  empty.hidden=tot>0;
  dl.replaceChildren(...S.hist.slice(0,60).map(h=>el('option',{value:h})));
  const have=new Set(todo.map(i=>norm(i.t)));
  chips.replaceChildren(...S.hist.filter(h=>!have.has(norm(h))).slice(0,10).map(h=>{
    const b=el('button',{type:'button',textContent:emo(h,cat(h))+' '+h});
    b.onclick=()=>{addItem(h);render()};return b;
  }));
  save();
}

function addItem(t){
  cur().items.unshift({t,d:false});
  S.hist=[t,...S.hist.filter(h=>h.toLowerCase()!==t.toLowerCase())].slice(0,100);
}
f.onsubmit=e=>{
  e.preventDefault();
  const parts=inp.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length)return;
  parts.reverse().forEach(addItem);
  inp.value='';render();inp.focus();
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)mic.hidden=true;
else mic.onclick=()=>{
  try{
    const r=new SR();r.lang='es-ES';
    r.onresult=e=>{inp.value=e.results[0][0].transcript;f.requestSubmit()};
    r.onerror=()=>say('No se pudo usar el micrófono');
    r.start();say('Escuchando…');
  }catch(e){say('No se pudo usar el micrófono')}
};

function ask(title,val,confirmOnly){
  return new Promise(res=>{
    dt.textContent=title;di.hidden=!!confirmOnly;di.value=val||'';dlg.returnValue='';
    dlg.onclose=()=>res(dlg.returnValue==='ok'?(confirmOnly?true:di.value.trim()):null);
    $('#dno').onclick=()=>dlg.close('no');
    dlg.showModal();if(!confirmOnly)di.focus();
  });
}

sel.onchange=()=>{S.cur=sel.value;render()};
$('#bNew').onclick=async()=>{
  const n=await ask('Nueva lista','');
  if(n){const id=uid();S.lists.push({id,name:n,items:[]});S.cur=id;render()}
};
$('#bMenu').onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden};
document.addEventListener('click',()=>{menu.hidden=true});

menu.onclick=async e=>{
  const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
  menu.hidden=true;const l=cur();
  if(a==='uncheck'){l.items.forEach(i=>i.d=false);render()}
  else if(a==='clear'){l.items=l.items.filter(i=>!i.d);render()}
  else if(a==='rename'){const n=await ask('Renombrar lista',l.name);if(n){l.name=n;render()}}
  else if(a==='del'){
    if(await ask('¿Eliminar la lista «'+l.name+'»?','',true)){
      if(S.lists.length>1)S.lists=S.lists.filter(x=>x!==l);else{l.items=[];l.name='Mi lista'}
      S.cur=S.lists[0].id;render();
    }
  }
  else if(a==='share'){
    const txt=l.name+'\n'+l.items.map(i=>(i.d?'✓ ':'• ')+i.t).join('\n');
    try{
      if(navigator.share){await navigator.share({title:l.name,text:txt})}
      else{await navigator.clipboard.writeText(txt);say('Lista copiada')}
    }catch(err){say('No se pudo compartir')}
  }
};
render();
</script>
</body>
</html>
